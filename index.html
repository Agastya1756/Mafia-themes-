<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theme Table: Mafia theme reviews</title>
<style>
:root{--felt:#17392b;--felt2:#0f2a1f;--ivory:#f3ecd9;--ink:#1d2a24;--mut:#6b705f;--brass:#b8892b;--line:#d8cfb6}
*{box-sizing:border-box}
body{margin:0;background:var(--felt);color:var(--ivory);font:16px/1.55 system-ui,sans-serif}
h1,h2,h3{font-family:"Palatino Linotype",Palatino,Georgia,serif;font-weight:700;margin:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 22px;background:var(--felt2)}
h1{font-size:1.5rem}
main{max-width:1040px;margin:0 auto;padding:22px}
button,input,select,textarea{font:inherit}
button{background:var(--brass);color:#1b1405;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600}
button.ghost{background:none;color:inherit;border:1px solid currentColor;opacity:.85}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tabs button{background:none;color:var(--ivory);border:1px solid var(--line);opacity:.8}
.tabs button.on{background:var(--ivory);color:var(--ink);opacity:1}
#intro{margin:0 0 16px;color:#cfc8b4}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.bar input{flex:2;min-width:170px}.bar select{flex:1;min-width:120px;width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{position:relative;background:var(--ivory);color:var(--ink);border-radius:12px;padding:16px 16px 14px 74px;cursor:pointer;min-height:120px;box-shadow:0 2px 0 #0006}
.card:hover{transform:translateY(-2px)}
.idx{position:absolute;left:12px;top:12px;width:48px;text-align:center;font:700 1.6rem/1 Georgia,serif;border-right:1px solid var(--line);padding-right:10px}
.idx small{display:block;color:var(--brass);font-size:1rem}
.card h3{font-size:1.1rem;overflow-wrap:anywhere}
.mut{color:var(--mut);font-size:.9rem}
.stars{color:var(--brass);letter-spacing:2px}
.chip{display:inline-block;border:1px solid currentColor;border-radius:99px;padding:0 9px;font-size:.8rem;margin:4px 6px 0 0;white-space:nowrap}
.d-Easy{color:#2f6b3f}.d-Average{color:#7d5f0e}.d-Hard{color:#a3342a}.d-Special{color:#5a3f8c}.t-idea{color:#1d4f73}
dialog{background:var(--ivory);color:var(--ink);border:0;border-radius:14px;width:min(660px,94vw);max-height:90vh;padding:22px}
dialog::backdrop{background:#000b}
.rev{border-top:1px solid var(--line);padding:10px 0}
.pick span{font-size:2rem;cursor:pointer;color:var(--line)}.pick span.on{color:var(--brass)}
label{display:block;margin:12px 0 4px;font-weight:600}
.two{display:flex;gap:10px}.two>div{flex:1}
.empty{grid-column:1/-1;padding:20px;border:1px dashed var(--line);border-radius:10px}
#more{display:block;margin:20px auto 0}
a{color:#7a5a12}
@media (prefers-reduced-motion:reduce){.card:hover{transform:none}}
</style>
</head>
<body>
<header><h1>Theme Table</h1><div id="auth"></div></header>
<main>
  <div class="tabs" role="tablist">
    <button data-t="approved" class="on">Approved themes</button>
    <button data-t="community">Community themes</button>
  </div>
  <p id="intro"></p>
  <div class="bar">
    <input id="q" type="search" placeholder="Search by theme or creator" aria-label="Search themes">
    <select id="pc" aria-label="Number of players"></select>
    <select id="df" aria-label="Hosting difficulty">
      <option value="">Any hosting difficulty</option>
      <option>Easy</option><option>Average</option><option>Hard</option><option>Special</option>
    </select>
    <select id="sort" aria-label="Sort themes">
      <option value="rating">Top rated</option>
      <option value="reviews">Most reviewed</option>
      <option value="az">A to Z</option>
      <option value="new">Newest</option>
    </select>
    <button id="add">Add your theme</button>
  </div>
  <div id="list" class="grid"></div>
  <button id="more" class="ghost">Show more</button>
</main>

<dialog id="dlg"></dialog>
<dialog id="addDlg">
  <h2>Add your theme</h2>
  <p class="mut">It appears under Community themes, where other players can rate and review it.</p>
  <form id="addForm">
    <label for="n">Theme name</label><input id="n" name="name" required minlength="2" maxlength="80">
    <label for="c">Creator</label><input id="c" name="creator" maxlength="60">
    <label for="d">What is it about?</label><textarea id="d" name="description" rows="3" maxlength="1000"></textarea>
    <label for="l">Link to the setup or game thread</label><input id="l" name="link" type="url" maxlength="300">
    <div class="two">
      <div><label for="mn">Fewest players</label><input id="mn" name="min" type="number" min="2" max="40" required></div>
      <div><label for="mx">Most players</label><input id="mx" name="max" type="number" min="2" max="40" required></div>
    </div>
    <label for="df2">How hard is it to host?</label>
    <select id="df2" name="difficulty"><option value="">Not sure</option><option>Easy</option><option>Average</option><option>Hard</option></select>
    <p style="margin-top:16px"><button>Save theme</button> <button type="button" class="ghost" id="cancelAdd">Cancel</button></p>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Paste your own two values here (copy them from your current index.html).
const SUPABASE_URL = 'https://oyjasgafpcggmtpkiivm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_qZEBleZ3yjjO7N4BHLaQxA_nj-BGJKF';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stars = n => { n = Math.round(n); return '★'.repeat(n) + '☆'.repeat(5 - n); };
const safeLink = u => /^https?:\/\//i.test(u || '') ? u : '';
const LEGEND = { Easy: 'Good for new hosts', Average: 'Requires some experience',
  Hard: "Challenging, even for experienced hosts. Don't host it until you've played it a couple of times.",
  Special: 'Requires explicit permission to host' };
const INTRO = { approved: 'Themes approved for hosting. Rate and review the ones you have played.',
  community: 'Themes added by players that are not approved yet.' };
const span = a => { if (!a || !a.length) return 'Players not listed'; const s = [...a].sort((x, y) => x - y), o = []; let i = 0;
  while (i < s.length) { let j = i; while (s[j + 1] === s[j] + 1) j++; o.push(j > i ? `${s[i]}–${s[j]}` : `${s[i]}`); i = j + 1; }
  return o.join(', ') + ' players'; };
const chips = t => (t.difficulty ? `<span class="chip d-${t.difficulty}" title="${esc(LEGEND[t.difficulty])}">Host: ${t.difficulty}</span>` : '')
  + `<span class="chip">${esc(span(t.player_counts))}</span>` + (t.is_idea ? '<span class="chip t-idea">IDEA</span>' : '');
let user = null, themes = [], tab = 'approved', shown = 60;

function renderAuth() {
  $('#auth').innerHTML = user
    ? `<span>${esc(user.user_metadata?.full_name || 'Signed in')}</span> <button class="ghost" id="out">Log out</button>`
    : '<button id="in">Log in with Discord</button>';
  if ($('#in')) $('#in').onclick = () => sb.auth.signInWithOAuth({ provider: 'discord', options: { redirectTo: location.origin + location.pathname } });
  if ($('#out')) $('#out').onclick = () => sb.auth.signOut();
}

async function load() {
  const { data, error } = await sb.from('theme_stats').select('*');
  if (error) { $('#list').innerHTML = `<div class="empty">Could not load themes: ${esc(error.message)}</div>`; return; }
  themes = data; render();
}

function render() {
  $('#intro').textContent = INTRO[tab];
  $('#add').style.display = tab === 'community' ? '' : 'none';
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const q = $('#q').value.toLowerCase(), pc = +$('#pc').value, df = $('#df').value, k = $('#sort').value;
  const when = t => t.created_on || t.created_at || '';
  const rows = themes.filter(t => t.status === tab
      && (t.name + ' ' + (t.creator || '')).toLowerCase().includes(q)
      && (!pc || (t.player_counts || []).includes(pc)) && (!df || t.difficulty === df))
    .sort((a, b) => k === 'az' ? a.name.localeCompare(b.name)
      : k === 'new' ? when(b).localeCompare(when(a))
      : k === 'reviews' ? b.review_count - a.review_count || a.name.localeCompare(b.name)
      : Number(b.avg_rating) - Number(a.avg_rating) || b.review_count - a.review_count || a.name.localeCompare(b.name));
  $('#list').innerHTML = rows.slice(0, shown).map(t => `
    <div class="card" tabindex="0" role="button" data-id="${t.id}">
      <div class="idx">${Number(t.avg_rating) ? Number(t.avg_rating).toFixed(1) : '–'}<small>★</small></div>
      <h3>${esc(t.name)}</h3>
      <div class="mut">by ${esc(t.creator || 'unknown')}, ${t.review_count} review${t.review_count == 1 ? '' : 's'}</div>
      <div>${chips(t)}</div>
    </div>`).join('') || `<div class="empty">${tab === 'community' ? 'No community themes match. Add yours with “Add your theme”.' : 'No themes match these filters.'}</div>`;
  $('#more').style.display = rows.length > shown ? '' : 'none';
  $('#more').textContent = `Show more (${rows.length - shown} left)`;
}

async function openTheme(id) {
  const t = themes.find(x => x.id == id);
  const { data } = await sb.from('reviews').select('*').eq('theme_id', id).order('created_at', { ascending: false });
  const revs = data || [];
  const mine = user && revs.find(r => r.user_id === user.id);
  let pick = mine ? mine.rating : 0;
  const d = $('#dlg');
  d.innerHTML = `
    <button class="ghost" style="float:right" id="x">Close</button>
    <h2>${esc(t.name)}</h2>
    <div class="mut">by ${esc(t.creator || 'unknown')}${t.created_on ? ', created ' + new Date(t.created_on).getFullYear() : ''}${t.status === 'community' ? ', not approved yet' : ''}</div>
    <div class="stars">${stars(t.avg_rating)} <span class="mut">${Number(t.avg_rating) || '–'} from ${t.review_count} review(s)</span></div>
    <div>${chips(t)}</div>
    ${t.difficulty ? `<p class="mut">${esc(LEGEND[t.difficulty])}</p>` : ''}
    ${t.notes ? `<p>${esc(t.notes)}</p>` : ''}
    ${t.description ? `<p>${esc(t.description)}</p>` : ''}
    ${safeLink(t.link) ? `<p><a href="${esc(safeLink(t.link))}" target="_blank" rel="noopener">Open the theme page</a></p>` : ''}
    <h3 style="margin-top:18px">${mine ? 'Your review' : 'Write a review'}</h3>
    ${user ? `
      <div class="pick" id="pick" aria-label="Your rating">${[1,2,3,4,5].map(i => `<span data-v="${i}">★</span>`).join('')}</div>
      <textarea id="body" rows="3" maxlength="2000" placeholder="How did it play? Balance, flavour, fun">${esc(mine?.body || '')}</textarea>
      <p><button id="save">${mine ? 'Update review' : 'Post review'}</button> ${mine ? '<button class="ghost" id="del">Delete my review</button>' : ''}</p>`
      : '<p class="mut">Log in with Discord to rate this theme.</p>'}
    <h3 style="margin-top:18px">Reviews</h3>
    ${revs.map(r => `<div class="rev"><span class="stars">${stars(r.rating)}</span> <b>${esc(r.author)}</b>
      <span class="mut">${new Date(r.created_at).toLocaleDateString()}</span><div>${esc(r.body || '')}</div></div>`).join('') || '<p class="mut">No reviews yet.</p>'}`;

  const paint = () => d.querySelectorAll('#pick span').forEach(s => s.classList.toggle('on', +s.dataset.v <= pick));
  d.querySelectorAll('#pick span').forEach(s => s.onclick = () => { pick = +s.dataset.v; paint(); });
  paint();
  d.querySelector('#x').onclick = () => d.close();
  const done = async () => { await load(); openTheme(id); };
  const save = d.querySelector('#save');
  if (save) save.onclick = async () => {
    if (!pick) return alert('Choose a star rating first.');
    const { error } = await sb.from('reviews').upsert(
      { theme_id: id, user_id: user.id, rating: pick, body: d.querySelector('#body').value.trim() },
      { onConflict: 'theme_id,user_id' });
    error ? alert(error.message) : done();
  };
  const del = d.querySelector('#del');
  if (del) del.onclick = async () => {
    if (!confirm('Delete your review?')) return;
    const { error } = await sb.from('reviews').delete().eq('id', mine.id);
    error ? alert(error.message) : done();
  };
  if (!d.open) d.showModal();
}

$('#pc').innerHTML = '<option value="">Any player count</option>' + Array.from({ length: 19 }, (_, i) => `<option value="${i + 2}">${i + 2} players</option>`).join('');
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; shown = 60; render(); });
['q', 'pc', 'df', 'sort'].forEach(id => $('#' + id).addEventListener('input', () => { shown = 60; render(); }));
$('#more').onclick = () => { shown += 60; render(); };
$('#list').onclick = e => { const c = e.target.closest('.card'); if (c) openTheme(c.dataset.id); };
$('#list').onkeydown = e => { if (e.key === 'Enter') { const c = e.target.closest('.card'); if (c) openTheme(c.dataset.id); } };
$('#add').onclick = () => user ? $('#addDlg').showModal() : alert('Log in with Discord to add a theme.');
$('#cancelAdd').onclick = () => $('#addDlg').close();
$('#addForm').onsubmit = async e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  let lo = +f.min, hi = +f.max; if (lo > hi) [lo, hi] = [hi, lo];
  const { error } = await sb.from('themes').insert({
    name: f.name.trim(), creator: f.creator.trim(), description: f.description.trim(), link: f.link.trim(),
    difficulty: f.difficulty || null, player_counts: Array.from({ length: hi - lo + 1 }, (_, i) => lo + i) });
  if (error) return alert(error.code === '23505' ? 'A theme with that name already exists.' : error.message);
  e.target.reset(); $('#addDlg').close(); tab = 'community'; load();
};

sb.auth.onAuthStateChange((_e, s) => { user = s?.user || null; renderAuth(); });
load();
</script>
</body>
</html>
